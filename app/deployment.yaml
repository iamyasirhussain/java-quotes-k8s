apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-quotes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-quotes
  template:
    metadata:
      labels:
        app: java-quotes
    spec:
      containers:
        - name: java-quotes
          image: hussainy/java-quotes-app:5
          ports:
            - containerPort: 8000
